<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Game Catalog — แก้ไขเกม</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar-game">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand text-decoration-none" th:href="@{/games}">
                <i class="bi bi-controller me-2"></i>Game Catalog
            </a>
            <span class="nav-text">CP353002 — Lab 7</span>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <!-- Page Header -->
                <div class="page-header">
                    <a th:href="@{/games}" class="text-secondary text-decoration-none d-inline-block mb-2" style="font-size: 0.88rem;">
                        <i class="bi bi-arrow-left me-1"></i>กลับไปรายการเกม
                    </a>
                    <h1><i class="bi bi-pencil-square me-2"></i>แก้ไขข้อมูลเกม</h1>
                    <p class="subtitle">
                        แก้ไขข้อมูลเกม:
                        <strong th:text="${game.title}">Game Title</strong>
                    </p>
                </div>

                <!-- Edit Form -->
                <div class="card-glass p-4">
                    <form th:action="@{/games/update/{id}(id=${game.id})}" th:object="${game}" method="post" class="form-game">

                        <!-- Title -->
                        <div class="mb-3">
                            <label for="title" class="form-label">
                                <i class="bi bi-joystick me-1"></i>ชื่อเกม
                            </label>
                            <input type="text" id="title" th:field="*{title}" class="form-control" required>
                        </div>

                        <!-- Genre + Platform -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="genre" class="form-label">
                                    <i class="bi bi-tags me-1"></i>แนวเกม (Genre)
                                </label>
                                <input type="text" id="genre" th:field="*{genre}" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="platform" class="form-label">
                                    <i class="bi bi-display me-1"></i>แพลตฟอร์ม (Platform)
                                </label>
                                <input type="text" id="platform" th:field="*{platform}" class="form-control" required>
                            </div>
                        </div>

                        <!-- Rating + Price + Discount Strategy -->
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="rating" class="form-label">
                                    <i class="bi bi-star me-1"></i>คะแนน (Rating)
                                </label>
                                <input type="number" id="rating" th:field="*{rating}" class="form-control"
                                       step="0.1" min="0" max="10" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="price" class="form-label">
                                    <i class="bi bi-currency-exchange me-1"></i>ราคาปกติ (บาท)
                                </label>
                                <input type="number" id="price" th:field="*{price}" class="form-control"
                                       step="0.01" min="0" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="discountType" class="form-label">
                                    <i class="bi bi-percent me-1"></i>ส่วนลด (Strategy)
                                </label>
                                <select id="discountType" th:field="*{discountType}" class="form-select">
                                    <option value="NONE">ราคาปกติ (0%)</option>
                                    <option value="STUDENT">ส่วนลดนักศึกษา (10%)</option>
                                    <option value="SEASONAL">ส่วนลดเทศกาล (20%)</option>
                                </select>
                            </div>
                        </div>

                        <!-- Release Date -->
                        <div class="mb-4">
                            <label for="releaseDate" class="form-label">
                                <i class="bi bi-calendar-event me-1"></i>วันวางจำหน่าย (Release Date)
                            </label>
                            <input type="date" id="releaseDate" th:field="*{releaseDate}" class="form-control" required>
                        </div>

                        <!-- Actions -->
                        <div class="d-flex gap-3 pt-2">
                            <button type="submit" class="btn btn-gold">
                                <i class="bi bi-check-circle me-2"></i>อัปเดต
                            </button>
                            <a th:href="@{/games}" class="btn btn-ghost">
                                <i class="bi bi-x-circle me-2"></i>ยกเลิก
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

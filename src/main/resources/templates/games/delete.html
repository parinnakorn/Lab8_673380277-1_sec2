<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Game Catalog — ยืนยันการลบ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar-game">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand text-decoration-none" th:href="@{/games}">
                <i class="bi bi-controller me-2"></i>Game Catalog
            </a>
            <span class="nav-text">CP353002 — Lab 7</span>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-xl-5">
                <!-- Page Header -->
                <div class="page-header">
                    <a th:href="@{/games}" class="text-secondary text-decoration-none d-inline-block mb-2" style="font-size: 0.88rem;">
                        <i class="bi bi-arrow-left me-1"></i>กลับไปรายการเกม
                    </a>
                    <h1><i class="bi bi-trash3 me-2"></i>ยืนยันการลบ</h1>
                </div>

                <!-- Delete Confirmation Card -->
                <div class="card-glass delete-card p-4">
                    <!-- Warning Icon -->
                    <div class="text-center mb-4">
                        <i class="bi bi-exclamation-triangle delete-icon"></i>
                        <h4 class="mt-3" style="font-family: var(--font-heading);">คุณแน่ใจหรือไม่?</h4>
                        <p class="text-secondary">การดำเนินการนี้จะลบข้อมูลเกมออกจากระบบอย่างถาวร</p>
                    </div>

                    <!-- Game Details -->
                    <div class="card-glass p-3 mb-4">
                        <div class="detail-row">
                            <span class="detail-label">ชื่อเกม</span>
                            <span class="detail-value" th:text="${game.title}">Game Title</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">แนวเกม</span>
                            <span>
                                <span class="badge badge-genre" th:text="${game.genre}">Action</span>
                            </span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">แพลตฟอร์ม</span>
                            <span>
                                <span class="badge badge-platform" th:text="${game.platform}">PC</span>
                            </span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">คะแนน</span>
                            <span class="star-rating">
                                <i class="bi bi-star-fill me-1"></i>
                                <span th:text="${#numbers.formatDecimal(game.rating, 1, 1)}">4.5</span>
                            </span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">ราคา</span>
                            <span class="detail-value" th:text="${#numbers.formatDecimal(game.price, 1, 2)} + ' บาท'">1990.00 บาท</span>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-flex justify-content-center gap-3">
                        <form th:action="@{/games/delete/{id}(id=${game.id})}" method="post">
                            <button type="submit" class="btn btn-danger-glow">
                                <i class="bi bi-trash3 me-2"></i>ยืนยันลบ
                            </button>
                        </form>
                        <a th:href="@{/games}" class="btn btn-ghost">
                            <i class="bi bi-arrow-left me-2"></i>ยกเลิก
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛍️ Product Shop — ยืนยันการลบ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <nav class="navbar-game">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand text-decoration-none" th:href="@{/products}">
                <i class="bi bi-shop me-2"></i>Product Shop
            </a>
            <span class="nav-text">CP353002 — Lab 8</span>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-xl-5">
                <div class="page-header">
                    <a th:href="@{/products}" class="text-secondary text-decoration-none d-inline-block mb-2" style="font-size: 0.88rem;">
                        <i class="bi bi-arrow-left me-1"></i>กลับไปรายการสินค้า
                    </a>
                    <h1><i class="bi bi-trash3 me-2"></i>ยืนยันการลบ</h1>
                </div>

                <div class="card-glass delete-card p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-exclamation-triangle delete-icon"></i>
                        <h4 class="mt-3" style="font-family: var(--font-heading);">คุณแน่ใจหรือไม่?</h4>
                        <p class="text-secondary">การลบสินค้าจะลบ ProductDetail และ Review ที่เกี่ยวข้องออกจากระบบอย่างถาวร (cascade)</p>
                    </div>

                    <div class="card-glass p-3 mb-4">
                        <div class="detail-row">
                            <span class="detail-label">ชื่อสินค้า</span>
                            <span class="detail-value" th:text="${product.name}">Product Name</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">หมวดหมู่</span>
                            <span>
                                <span class="badge badge-genre" th:text="${product.category}">Category</span>
                            </span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">ยี่ห้อ</span>
                            <span>
                                <span class="badge badge-platform" th:text="${product.brand}">Brand</span>
                            </span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">จำนวนรีวิว</span>
                            <span class="star-rating" th:text="${product.reviews != null ? #lists.size(product.reviews) : 0}">0</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">ราคา</span>
                            <span class="detail-value" th:text="${#numbers.formatDecimal(product.price, 1, 2)} + ' บาท'">1990.00 บาท</span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-center gap-3">
                        <form th:action="@{/products/delete/{id}(id=${product.id})}" method="post">
                            <button type="submit" class="btn btn-danger-glow">
                                <i class="bi bi-trash3 me-2"></i>ยืนยันลบ
                            </button>
                        </form>
                        <a th:href="@{/products}" class="btn btn-ghost">
                            <i class="bi bi-arrow-left me-2"></i>ยกเลิก
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
